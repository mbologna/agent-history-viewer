name: CI

# Pull requests and main only: a branch push already gets its pull request's
# run. Monday's schedule and a manual run add the auto-release job; the
# binaries build in release.yml, on the tag it creates.
"on":
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on the default branch: it may be releasing, and a cut
  # release leaves a tag without its Release.
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: read

jobs:
  go:
    uses: mbologna/.github/.github/workflows/go-ci.yml@5797c3f0e987ee045b00d0a1640dfcdce3c45ce0 # main

  auto-release:
    needs: [go]
    # contents: push the tag and create the Release; actions: start
    # release.yml on it, since a tag pushed with GITHUB_TOKEN triggers no run.
    permissions:
      contents: write
      actions: write
    uses: mbologna/.github/.github/workflows/auto-release.yml@5797c3f0e987ee045b00d0a1640dfcdce3c45ce0 # main
    with:
      strategy: conventional
      dispatch_workflow: release.yml
    secrets: inherit
