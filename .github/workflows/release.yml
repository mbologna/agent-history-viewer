name: Release

# A tag pushed by hand starts this through `push`; a tag auto-release pushes
# (ci.yml) starts it through workflow_dispatch on the tag, because a tag
# pushed with GITHUB_TOKEN triggers no run.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # A manual run started on a branch has nothing to release.
    if: startsWith(github.ref, 'refs/tags/v')
    name: Build and release
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -mod=vendor -ldflags="-s -w" \
            -o ahv-${{ matrix.goos }}-${{ matrix.goarch }} .

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ahv-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ahv-${{ matrix.goos }}-${{ matrix.goarch }}

  release:
    name: Create GitHub release
    runs-on: ubuntu-26.04
    needs: build
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true

      # auto-release creates the Release, with its notes, before it starts
      # this workflow: then only the binaries are attached.
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ahv-* \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" ahv-* \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --generate-notes
          fi
