name: PR title

# The squash-merge commit takes the PR title as its subject, and auto-release
# reads that subject: the title must be a Conventional Commit.

"on":
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    uses: mbologna/.github/.github/workflows/pr-title.yml@bcb4fa925ee0b89711d2804280b8dd63642a32e4 # main
